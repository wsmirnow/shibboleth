---
driver:
  name: containers
dependency:
  name: galaxy
  enabled: false
platforms:
  # GH Action for EL8 fails
  # - name: shibboleth_el8
  #   image: quay.io/rockylinux/rockylinux:8
  #   pre_build_image: false
  #   command: /sbin/init
  #   tmpfs:
  #     "/tmp": "exec"
  #     "/run": "rw,noexec,nosuid,nodev"
  #   volumes:
  #     - /sys/fs/cgroup:/sys/fs/cgroup:ro
  - name: shibboleth_el9
    image: quay.io/rockylinux/rockylinux:9
    pre_build_image: false
    command: /sbin/init
    tmpfs:
      "/tmp": "exec"
      "/run": "rw,noexec,nosuid,nodev"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
  - name: shibboleth_el10
    image: quay.io/rockylinux/rockylinux:10
    pre_build_image: false
    command: /sbin/init
    tmpfs:
      "/tmp": "exec"
      "/run": "rw,noexec,nosuid,nodev"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
  - name: shibboleth_debian
    image: docker.io/debian:stable
    pre_build_image: false
    command: /sbin/init
    tmpfs:
      "/tmp": "exec"
      "/run": "rw,noexec,nosuid,nodev"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
  - name: shibboleth_ubuntu
    image: docker.io/ubuntu:latest
    pre_build_image: false
    command: /sbin/init
    tmpfs:
      "/tmp": "exec"
      "/run": "rw,noexec,nosuid,nodev"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
lint: |
  set -e
  yamllint -c .yamllint .
  ansible-lint
provisioner:
  name: ansible
verifier:
  name: ansible
